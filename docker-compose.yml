services:
  db:
    image: postgres:15
    container_name: const-postgres-container
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data/:/var/lib/postgresql/data/

  backend:
    build: ./server
    container_name: const-django-container
    env_file:
      - .env
    command: sh -c "gunicorn constellate_proj.wsgi:application --bind 0.0.0.0:8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    depends_on:
      - db
