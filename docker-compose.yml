version: "3.9"

services:
  db:
    image: postgres:15
    container_name: const-postgres-container
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data/:/var/lib/postgresql/data/

  backend:
    build: ./server
    container_name: const-django-container
    env_file:
      - .env
    command: sh -c "gunicorn constellate_proj.wsgi.application --bind 0.0.0.0:8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    depends_on:
      - db

  frontend:
    image: client-img
    build: ./client
    container_name: const-client-container
    ports:
      - "80:80"
      - "443:443"
    volumes:
        # - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        # - ./client/dist:/usr/share/nginx/html
      - ./client/dist:/usr/share/nginx/html
      - ./default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
