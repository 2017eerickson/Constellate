appId: com.constellate.app
---
- launchApp
- tapOn:
    id: "home-tab"
- tapOn:
    id: "sign-out-button"
- tapOn:
    id: "email-input"
- inputText: "userA@test.com"
- tapOn:
    id: "password-input"
- inputText: "testpassword123"
- tapOn:
    id: "email-submit-button"
- tapOn: "Not Now"
- tapOn: 
    id: "partners-tab"
- assertVisible: "Partners"
- tapOn:
    id: "add-partner-button"
- tapOn:
    id: "partner-code-input"
- inputText: "${PARTNER_C_CODE}"
- tapOn:
    id: "connect-button"
- assertVisible: "Sent!"
- tapOn:
    text: "OK"
- assertVisible: "Request pending"
- swipe:
    direction: DOWN
- tapOn:
    id: "home-tab"
- tapOn:
    id: "sign-out-button"
- tapOn:
    id: "email-input"
- inputText: "userC@test.com"
- tapOn:
    id: "password-input"
- inputText: "testpassword123"
- tapOn:
    id: "email-submit-button"
- tapOn: "Not Now"
- tapOn:
    id: "partners-tab"
- assertVisible: "Partners"
- tapOn:
    id: "add-partner-button"
- assertVisible: "Wants to connect with you"
- tapOn:
    id: "decline-button"
- assertVisible: "No pending requests"
