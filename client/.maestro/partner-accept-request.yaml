appId: com.constellate.app
---
- launchApp
- tapOn:
    text: "Home"
- tapOn:
    id: "sign-out-button"
- tapOn:
    id: "email-input"
- inputText: "userB@test.com"
- tapOn:
    id: "password-input"
- inputText: "testpassword123"
- tapOn:
    id: "email-submit-button"
- assertVisible: "Partners"
- tapOn:
    id: "add-partner-button"
- assertVisible: "Wants to connect with you"
- tapOn:
    id: "accept-button"
- tapOn:
    text: "Partners"
- assertVisible: "TestUserA"
